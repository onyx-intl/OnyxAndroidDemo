apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = 'com.android.onyx.demo'
    compileSdk = rootProject.ext.compileSdk

    defaultConfig {
        applicationId = "com.android.onyx.demo"
        minSdk = 24
        targetSdk = rootProject.ext.targetSdk
        versionCode = 1
        versionName = "1.0"
        multiDexEnabled = true
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ['targetModuleName': 'Scribble']
            }
        }

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = rootProject.ext.javaVersion
        targetCompatibility = rootProject.ext.javaVersion
    }

    buildFeatures {
        dataBinding = true
    }

    packaging {
        jniLibs {
            pickFirsts += ['lib/*/libc++_shared.so']
        }
    }

    lint {
        abortOnError = false
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.0.2'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test:runner:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.1'

    implementation('com.onyx.android.sdk:onyxsdk-device:1.3.5.3')
    implementation('com.onyx.android.sdk:onyxsdk-pen:1.5.4.4')

    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'

    implementation "androidx.multidex:multidex:2.0.0"
    api "androidx.constraintlayout:constraintlayout:1.1.3"

    annotationProcessor "com.github.Raizlabs.DBFlow:dbflow-processor:4.2.4"
    implementation "com.github.Raizlabs.DBFlow:dbflow-core:4.2.4"
    implementation "com.github.Raizlabs.DBFlow:dbflow:4.2.4"
}
