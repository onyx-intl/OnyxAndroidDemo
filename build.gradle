// Top-level build file where you can add configuration options common to all sub-projects/modules.

ext {
    compileSdk = 34
    targetSdk = 34
    javaVersion = JavaVersion.VERSION_17
    coroutines_version = '1.9.0'
    lifecycle_runtime_ktx_version = '2.6.2'
}

buildscript {
    ext {
        kotlin_version = '2.2.20'
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        maven {
            url = 'https://repo.boox.com/repository/proxy-public/'
        }
        maven {
            url = 'https://repo.boox.com/repository/maven-public/'
        }
        google()
        mavenCentral()
        maven { url = 'https://jitpack.io' }
    }

    // Align transitive kotlin-stdlib with the Kotlin Gradle plugin.
    configurations.configureEach {
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
