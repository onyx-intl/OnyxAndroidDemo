// Top-level build file where you can add configuration options common to all sub-projects/modules.

ext {
    compileSdk = 34
    targetSdk = 34
    javaVersion = JavaVersion.VERSION_17
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
    }
}

allprojects {
    repositories {
        maven {
            url = 'https://repo.boox.com/repository/proxy-public/'
        }
        maven {
            url = 'https://repo.boox.com/repository/maven-public/'
        }
        google()
        mavenCentral()
        maven { url = 'https://jitpack.io' }
    }

    // Needed: transitive kotlin-stdlib 1.8.10 + kotlin-stdlib-jdk7/8 1.6.10
    // duplicate the same classes. Align until onyxsdk/AndroidX stop pulling mixed versions.
    configurations.configureEach {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
